# This rule is not used by the project kardigan itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to kardigan.paulgreco.ca resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kardigan
    app.kubernetes.io/managed-by: kustomize
  name: cardinalityreport-viewer-role
rules:
- apiGroups:
  - kardigan.paulgreco.ca
  resources:
  - cardinalityreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kardigan.paulgreco.ca
  resources:
  - cardinalityreports/status
  verbs:
  - get
