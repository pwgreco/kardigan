---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: cardinalityreports.kardigan.paulgreco.ca
spec:
  group: kardigan.paulgreco.ca
  names:
    kind: CardinalityReport
    listKind: CardinalityReportList
    plural: cardinalityreports
    shortNames:
    - crpt
    singular: cardinalityreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.budgetRef
      name: Budget
      type: string
    - jsonPath: .status.totalSeries
      name: Series
      type: integer
    - jsonPath: .status.potentialSavings
      name: Savings
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.generatedAt
      name: Generated
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CardinalityReport is the Schema for the cardinalityreports API. Kardigan
          creates one for each CardinalityBudget.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CardinalityReport
            properties:
              budgetRef:
                description: BudgetRef names the CardinalityBudget in the same namespace.
                minLength: 1
                type: string
            required:
            - budgetRef
            type: object
          status:
            description: status defines the observed state of CardinalityReport
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              generatedAt:
                description: |-
                  GeneratedAt is when Recommendations were last worked out. After a failed
                  run they stay as they were, and the Ready condition says what went wrong.
                format: date-time
                type: string
              potentialSavings:
                description: PotentialSavings is the active series RelabelSnippet
                  would remove.
                format: int64
                type: integer
              recommendations:
                description: Recommendations is capped at 25, largest savings first.
                items:
                  description: Recommendation is one suggested change, or a note that
                    a metric should stay.
                  properties:
                    action:
                      enum:
                      - DropMetric
                      - DropLabel
                      - FixLabel
                      - TrimHistogram
                      - Keep
                      type: string
                    confidence:
                      description: Confidence is empty for Keep.
                      enum:
                      - Low
                      - Medium
                      type: string
                    label:
                      description: Label is set for DropLabel and FixLabel.
                      type: string
                    metric:
                      type: string
                    reason:
                      type: string
                    seriesSaved:
                      description: |-
                        SeriesSaved is the active series this change would remove. Savings for
                        labels and histograms on the same metric overlap, so don't add them up.
                      format: int64
                      type: integer
                  required:
                  - action
                  - metric
                  - reason
                  - seriesSaved
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              relabelSnippet:
                description: |-
                  RelabelSnippet is YAML to paste into a ServiceMonitor or PodMonitor
                  endpoint. Kardigan never applies it.
                type: string
              totalSeries:
                description: TotalSeries is the target's active series.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
