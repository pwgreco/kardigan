{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kardigan.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardigan.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kardigan.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
{{- end }}
