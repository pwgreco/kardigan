{{- /*
The CRDs live in templates/, not Helm's crds/ directory, because Helm never
upgrades anything in crds/ and this API will change while it's v1alpha1.
files/crds/ is copied from config/crd/bases by make manifests.
*/ -}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := merge (dict "helm.sh/resource-policy" "keep") (default dict $crd.metadata.annotations) }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
