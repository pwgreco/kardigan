apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kardigan.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardigan.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kardigan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kardigan.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kardigan.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --zap-devel=false
            - {{ printf "--mimir-url=%s" (required "mimir.url is required, for example --set mimir.url=http://mimir-gateway.mimir.svc:8080" .Values.mimir.url) | quote }}
            - {{ printf "--mimir-timeout=%s" .Values.mimir.timeout | quote }}
            {{- with .Values.mimir.tenant }}
            - {{ printf "--mimir-tenant=%s" . | quote }}
            {{- end }}
            {{- with .Values.grafana.url }}
            - {{ printf "--grafana-url=%s" . | quote }}
            - {{ printf "--grafana-timeout=%s" $.Values.grafana.timeout | quote }}
            {{- end }}
            - {{ printf "--report-interval=%s" .Values.reportInterval | quote }}
            {{- with .Values.budgetAdminNamespaces }}
            - {{ printf "--budget-admin-namespaces=%s" (join "," .) | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # The Go garbage collector can't see the container's memory limit otherwise.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          {{- with .Values.grafana.tokenSecret.name }}
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.grafana.tokenSecret.key }}
          {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
